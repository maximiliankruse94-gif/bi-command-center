[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#171a21"
textColor = "#eef0f3"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
enableCORS = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
